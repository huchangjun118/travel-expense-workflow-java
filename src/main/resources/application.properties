server.port=8080
# 记账币种
expense.ledger-currency=CNY
# 汇率最大有效秒数
expense.rate-max-age-seconds=86400
# 崩溃恢复策略：COMPLETE 继续完成 / ROLLBACK 整体回滚
expense.recovery-strategy=COMPLETE
# 审批策略：按顺序匹配，命中即固化
expense.policy-rules[0].max-amount=1000
expense.policy-rules[0].approver-roles[0]=MANAGER
expense.policy-rules[1].max-amount=10000
expense.policy-rules[1].approver-roles[0]=MANAGER
expense.policy-rules[1].approver-roles[1]=FINANCE
expense.policy-rules[2].approver-roles[0]=MANAGER
expense.policy-rules[2].approver-roles[1]=FINANCE
expense.policy-rules[2].approver-roles[2]=CFO
