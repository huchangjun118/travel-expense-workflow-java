server.port=8080

# H2 文件库，进程重启后数据保留，支持崩溃恢复
spring.datasource.url=jdbc:h2:file:./data/expense-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 记账币种与汇率策略
expense.book-currency=CNY
expense.fx-max-age-days=7
# 崩溃恢复策略：COMMIT 继续完成未完成的占用/释放；ROLLBACK 整体回滚
expense.recovery-strategy=COMMIT

# 审批策略：按顺序匹配，金额以记账币种计
approval.policy.rules[0].max-amount=1000
approval.policy.rules[0].levels[0]=MANAGER
approval.policy.rules[1].max-amount=10000
approval.policy.rules[1].levels[0]=MANAGER
approval.policy.rules[1].levels[1]=DIRECTOR
approval.policy.rules[2].department=FINANCE
approval.policy.rules[2].levels[0]=MANAGER
approval.policy.rules[2].levels[1]=DIRECTOR
approval.policy.rules[2].levels[2]=CFO
approval.policy.default-levels[0]=MANAGER
approval.policy.default-levels[1]=DIRECTOR
